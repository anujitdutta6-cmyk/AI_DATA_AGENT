[project]
name = "ai-data-agent"
version = "0.1.0"
description = "LangGraph-based AI data agent for SQL analysis and ETL workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
    "ipython>=9.0.0",
    "langchain>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "pyarrow>=15.0.0",
]

[project.scripts]
ai-data-agent = "main:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"
